        function loadExercises() {
            renderRandomQuiz(bankEx1, 'container-ex1', 5, 'ex1'); 
            renderRandomQuiz(bankEx2, 'container-ex2', 5, 'ex2'); 
            renderRandomQuiz(bankEx3, 'container-ex3', 5, 'ex3'); 
        }

        function renderRandomQuiz(sourceArray, containerId, count, prefix) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            const shuffled = [...sourceArray].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, Math.min(count, shuffled.length));

            selected.forEach((item, index) => {
                let optionsHtml = '';
                const shuffledOpts = [...item.options].sort(() => 0.5 - Math.random());

                shuffledOpts.forEach(opt => {
                    const isCorrect = (opt === item.answer);
                    optionsHtml += `<button class="btn-option" onclick="checkAnswer(this, ${isCorrect}, '${prefix}-${index}')">${opt}</button>`;
                });

                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.id = `${prefix}-${index}`;
                card.innerHTML = `
                    <div class="question">${index + 1}. ${item.q}</div>
                    <div class="options">${optionsHtml}</div>
                    <div class="feedback"></div>
                `;
                container.appendChild(card);
            });
        }

        function checkAnswer(button, isCorrect, cardId) {
            const card = document.getElementById(cardId);
            const buttons = card.querySelectorAll('.btn-option');
            const feedback = card.querySelector('.feedback');

            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                button.classList.add('correct');
                feedback.style.color = '#22c55e';
                feedback.textContent = 'Esatto! Ottimo colpo 🎉';
            } else {
                button.classList.add('wrong');
                feedback.style.color = '#ef4444';
                feedback.textContent = 'Ops, non è corretto!';
            }
        }

        function switchTab(index) {
            const tabs = document.querySelectorAll('.tab-btn');
            const sections = document.querySelectorAll('.section-exercise');

            tabs.forEach(t => t.classList.remove('active'));
            sections.forEach(s => s.classList.remove('active'));

            tabs[index].classList.add('active');
            sections[index].classList.add('active');
        }
