<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Hub - Home</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--accent);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 1.1rem;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 16px 22px;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            border-color: var(--accent);
            background-color: rgba(56, 189, 248, 0.05);
            transform: translateY(-2px);
        }

        .menu-btn span.icon {
            font-size: 1.3rem;
        }

        footer {
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>English Hub</h1>
        <p>Scegli l'argomento che vuoi allenare:</p>

        <div class="menu-grid">
            <!-- 1. Livello Base: Present Simple & Present Continuous -->
            <a href="present_simple.html" class="menu-btn">
                <span class="icon">🟢</span> Present Simple
            </a>
            <a href="Present_Countinuous.html" class="menu-btn">
                <span class="icon">🔵</span> Present Continuous
            </a>

            <!-- 2. Livello Intermedio: Past Simple & Past Continuous -->
            <a href="Past_Simple.html" class="menu-btn">
                <span class="icon">🟡</span> Past Simple
            </a>
            <a href="Past_Continuous.html" class="menu-btn">
                <span class="icon">⏳</span> Past Continuous
            </a>

            <!-- 3. Futuro -->
            <a href="will.html" class="menu-btn">
                <span class="icon">🚀</span> Future with Will
            </a>

            <!-- 4. Grammatica e Strumenti -->
            <a href="verbi_irregolari.html" class="menu-btn">
                <span class="icon">📖</span> Verbi Irregolari
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 English Hub</p>
    </footer>

</body>
</html>
